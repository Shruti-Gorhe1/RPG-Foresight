# nginx.conf — copied to /etc/nginx/templates/default.conf.template
# This file does NOT rely on envsubst anymore.
# backend is statically defined using an nginx variable.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # ── Gzip ───────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/x-javascript;
    gzip_min_length 1024;

    # ── DNS resolver (required when proxy_pass uses variables) ──────────────
    resolver 168.63.129.16 valid=15s ipv6=off;

    # ── Backend definition ──────────────────────────────────────────────────
    # BACKEND_URL is injected at container startup via envsubst
    # Set this env var on the ACA frontend container, e.g.:
    #   BACKEND_URL=https://digital-onboarding-us-be.<env>.eastus.azurecontainerapps.io
    set $backend_url ${BACKEND_URL};

    # ── API reverse proxy ───────────────────────────────────────────────────
    location /api/ {
        proxy_pass $backend_url;

        proxy_http_version 1.1;
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_verify        off;
        proxy_ssl_server_name   on;
        proxy_redirect          off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # ── React SPA ───────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Health probe ────────────────────────────────────────────────────────
    
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

}